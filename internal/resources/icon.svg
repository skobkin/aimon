<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LLM Monitor: activity pulse over a tray-like base. Static glyph,
       no text, theme-agnostic single color so it reads on light and dark
       tray backgrounds. -->
  <rect x="4" y="40" width="56" height="12" rx="4" fill="#4CAF50" fill-opacity="0.25"
        stroke="#4CAF50" stroke-width="3"/>
  <rect x="14" y="47" width="6" height="6" rx="1.5" fill="#4CAF50"/>
  <polyline points="10,32 20,32 26,14 36,40 42,26 48,32 54,32"
            fill="none" stroke="#4CAF50" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
