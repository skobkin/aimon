when:
  # Push builds only the default branch: a feature-branch push with an
  # open PR would otherwise run this pipeline and the pull_request one on
  # the same commit concurrently — duplicated work for the same result,
  # since the PR pipeline already tests the merged state.
  - event: push
    branch: master
  - event: pull_request
  - event: tag

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  fmt:
    image: golang:1.26-alpine
    # The tag is rolling; without this the runner keeps a stale cached
    # image (it served go1.26.1 while the tag had moved on).
    pull: true
    depends_on: []
    commands:
      - |
        export PATH=/usr/local/go/bin:/go/bin:$PATH
        fmt_out=$(/usr/local/go/bin/gofmt -l ./cmd ./internal 2>/dev/null)
        if [ -n "$fmt_out" ]; then
          echo "The following files need gofmt:"
          echo "$fmt_out"
          exit 1
        fi

  lint:
    image: golangci/golangci-lint:v2.13-alpine
    pull: true
    depends_on: []
    # No cgo, for speed: this step is ~10x faster without it (measured).
    # It skips the apk install of a C toolchain and the GL/X11/Wayland
    # headers and the cgo compilation of GLFW/OpenGL. See vet below for how.
    environment:
      CGO_ENABLED: "0"
    commands:
      - export CACHE_ROOT="$PWD/.ci-cache"
      - export GOMODCACHE="$CACHE_ROOT/gomod"
      - export GOCACHE="$CACHE_ROOT/gobuild"
      - export GOPATH="$CACHE_ROOT/gopath"
      - export GOLANGCI_LINT_CACHE="$CACHE_ROOT/golangci-lint"
      - export XDG_CACHE_HOME="$CACHE_ROOT/xdg"
      - mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOPATH/bin" "$GOLANGCI_LINT_CACHE" "$XDG_CACHE_HOME"
      - apk add --no-cache git
      - golangci-lint run --build-tags ci ./...

  vet:
    image: golang:1.26-alpine
    # The tag is rolling; without this the runner keeps a stale cached
    # image (it served go1.26.1 while the tag had moved on).
    pull: true
    depends_on: []
    # No cgo, for speed: lint, vet and test are ~10x faster this way
    # (measured). The cost was never our code but cgo: installing a C
    # toolchain plus the GL/X11/Wayland headers, then compiling GLFW and
    # OpenGL from C on every run. Fyne's `ci` build tag swaps that
    # GLFW/OpenGL app driver for its headless software driver, so these
    # steps need no C at all. Nothing is lost: the real windowing build
    # (cgo, no tag) is still compiled by the `build` step and the release.
    environment:
      CGO_ENABLED: "0"
    commands:
      - export PATH=/usr/local/go/bin:/go/bin:$PATH
      - export CACHE_ROOT="$PWD/.ci-cache"
      - export GOMODCACHE="$CACHE_ROOT/gomod"
      - export GOCACHE="$CACHE_ROOT/gobuild"
      - export GOPATH="$CACHE_ROOT/gopath"
      - mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOPATH/bin"
      - go vet -tags ci ./...

  test:
    image: golang:1.26-alpine
    # The tag is rolling; without this the runner keeps a stale cached
    # image (it served go1.26.1 while the tag had moved on).
    pull: true
    depends_on: []
    # No cgo, headless Fyne, ~10x faster: see the vet step for why.
    environment:
      CGO_ENABLED: "0"
    commands:
      - export PATH=/usr/local/go/bin:/go/bin:$PATH
      - export CACHE_ROOT="$PWD/.ci-cache"
      - export GOMODCACHE="$CACHE_ROOT/gomod"
      - export GOCACHE="$CACHE_ROOT/gobuild"
      - export GOPATH="$CACHE_ROOT/gopath"
      - mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOPATH/bin"
      - go test -tags ci ./...

  build:
    image: golang:1.26-alpine
    # The tag is rolling; without this the runner keeps a stale cached
    # image (it served go1.26.1 while the tag had moved on).
    pull: true
    depends_on: []
    when:
      - event: push
      - event: pull_request
    commands:
      - export PATH=/usr/local/go/bin:/go/bin:$PATH
      - export CACHE_ROOT="$PWD/.ci-cache"
      - export GOMODCACHE="$CACHE_ROOT/gomod"
      - export GOCACHE="$CACHE_ROOT/gobuild"
      - export GOPATH="$CACHE_ROOT/gopath"
      - mkdir -p "$GOMODCACHE" "$GOCACHE" "$GOPATH/bin" dist
      - apk add --no-cache build-base pkgconf mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev wayland-dev libxkbcommon-dev
      - go build -trimpath -o dist/aimon ./cmd/aimon

  release:
    image: goreleaser/goreleaser-cross:v1.26
    pull: true
    depends_on:
      - fmt
      - lint
      - vet
      - test
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_TOKEN
    commands:
      - test -n "$CI_FORGE_URL" || (echo "CI_FORGE_URL is empty. Cannot derive Forge URLs for GoReleaser." && exit 1)
      - test -n "$FORGE_API_URL" || export FORGE_API_URL="$CI_FORGE_URL/api/v1"
      - test -n "$FORGE_DOWNLOAD_URL" || export FORGE_DOWNLOAD_URL="$CI_FORGE_URL"
      - apt-get update
      # libwayland-dev + libxkbcommon-dev: go-gl/glfw includes wl_platform.h
      # unconditionally, which needs the Wayland and xkbcommon headers.
      - apt-get install --no-install-recommends -y pkg-config libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev
      - rm -rf "$PWD/.ci-cache"
      - goreleaser release --clean
    when:
      - event: tag
